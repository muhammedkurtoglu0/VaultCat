[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-pentest-tool"
version = "0.1.0"
description = "Authorized HashiCorp Vault reconnaissance and credential hijacking risk assessment CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "vault-pentest-tool contributors" }
]
keywords = [
  "hashicorp-vault",
  "vault",
  "security",
  "pentest",
  "reconnaissance",
  "credential-hygiene"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "requests>=2.31.0",
  "hvac>=2.0.0",
  "aiohttp>=3.9.0",
  "python-hcl2>=6.0.0",
  "mcp>=1.28.1",
  "openai>=2.44.0",
  "ollama>=0.6.0",
  "prompt_toolkit>=3.0.52",
  "fastapi>=0.139.0",
  "uvicorn>=0.50.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/muhammedkurtoglu0/vault-pentest-tool"
Repository = "https://github.com/muhammedkurtoglu0/vault-pentest-tool"
Issues = "https://github.com/muhammedkurtoglu0/vault-pentest-tool/issues"

[project.scripts]
vault-pentest = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = [
  "core",
  "active_execution",
  "active_execution.modules",
  "ai_core",
  "credential_hijacking",
  "reconnaissance",
  "scanners",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
