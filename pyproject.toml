[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-pentest-tool"
version = "1.0.0"
description = "Full-lifecycle HashiCorp Vault penetration testing toolkit — recon, hijack, escalate, exfiltrate, pivot, and persist across CLI, AI chat, and MCP server modes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "vault-pentest-tool contributors" }
]
keywords = [
  "hashicorp-vault",
  "vault",
  "security",
  "pentest",
  "penetration-testing",
  "reconnaissance",
  "credential-hygiene",
  "red-team",
  "ai-pentesting",
  "mcp-server",
  "vulnerability-assessment",
  "privilege-escalation",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
  "Topic :: System :: Networking :: Monitoring",
]

# ── Runtime dependencies (mirrors requirements.txt) ─────────────────────
dependencies = [
  "requests>=2.31.0",
  "hvac>=2.0.0",
  "aiohttp>=3.9.0",
  "python-hcl2>=6.0.0",
  "mcp>=1.28.1,<2.0.0",
  "openai>=2.44.0",
  "ollama>=0.6.0",
  "prompt_toolkit>=3.0.52",
  "fastapi>=0.139.0",
  "uvicorn>=0.50.2",
  "anthropic>=0.57.0",
  "typer>=0.15.0",
  "fpdf2>=2.7.0",
  "psycopg2-binary>=2.9",
  "duckduckgo-search>=6.0",
  "ddgs>=6.0",
  "trafilatura>=1.6.0",
  "beautifulsoup4>=4.12.0",
  "customtkinter>=5.2.0",
  "cryptography>=41.0.0",
  "loguru>=0.7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "responses>=0.25.0",
  "pytest-cov>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/muhammedkurtoglu0/vault-pentest-tool"
Repository = "https://github.com/muhammedkurtoglu0/vault-pentest-tool"
Issues = "https://github.com/muhammedkurtoglu0/vault-pentest-tool/issues"

[project.scripts]
vault-pentest = "main:main"

[tool.setuptools]
py-modules = ["main", "vault_cli"]
packages = [
  "core",
  "active_execution",
  "active_execution.modules",
  "active_execution.modules.cloud",
  "active_execution.modules.database",
  "active_execution.modules.general",
  "active_execution.modules.persistence",
  "active_execution.modules.pivot",
  "active_execution.modules.seal",
  "active_execution.modules.secrets",
  "active_execution.modules.token",
  "ai_core",
  "ai_core.planning",
  "credential_hijacking",
  "reconnaissance",
  "scanners",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "--strict-markers",
  "--tb=short",
]
markers = [
  "integration: tests that require a running Vault lab (docker compose up)",
  "mock_validity: tests that validate mock responses against real Vault API behavior",
  "slow: tests that take > 5 seconds",
]

[tool.coverage.run]
source = ["."]
omit = [
  ".venv/*",
  "tests/*",
  "vault-pentest-lab/*",
  "Lib/*",
  "*/__pycache__/*",
  # CLI + GUI — integration-tested, not unit-tested
  "vault_cli.py",
  "run_gui.py",
  "ai_core/gui_app.py",
  # Untested thin wrappers / legacy
  "scanners/token_scanner.py",
  "scanners/secret_scanner.py",
  "scanners/env_scanner.py",
]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@(abc\\.)?abstractmethod",
]
fail_under = 45
